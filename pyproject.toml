[tool.ruff]
line-length = 110
target-version = "py311"
exclude = [".venv", "app"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "RET", "ARG"]

[tool.ruff.lint.per-file-ignores]
# Tests deliberately take unused fixtures (they have side effects) and use long assertion messages.
"tests/*" = ["ARG001", "ARG002"]

[tool.ruff.lint.isort]
known-first-party = ["injector", "mapper", "monitor", "orchestrator", "safety", "schemas"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
