app_name: online-boutique
compose_project: online-boutique
frontend_url: http://localhost:8080
health_checks:
  - name: home
    url: http://localhost:8080/
  - name: product
    url: http://localhost:8080/product/OLJCESPC7Z
# Containers the injector may touch (names from `docker ps`). loadgenerator and the monitor are deliberately excluded.
allowed_containers:
  - online-boutique-adservice-1
  - online-boutique-cartservice-1
  - online-boutique-checkoutservice-1
  - online-boutique-currencyservice-1
  - online-boutique-emailservice-1
  - online-boutique-frontend-1
  - online-boutique-paymentservice-1
  - online-boutique-productcatalogservice-1
  - online-boutique-recommendationservice-1
  - online-boutique-redis-cart-1
  - online-boutique-shippingservice-1
thresholds:
  error_rate: 0.20
  p95_ms: 2000
max_experiment_seconds: 120